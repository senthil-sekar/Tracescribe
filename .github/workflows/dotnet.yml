name: dotnet

on:
  push:
    paths: ["dotnet/**", "spec/**", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["dotnet/**", "spec/**", ".github/workflows/dotnet.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins the 10.0 SDK; the 8.0 runtime runs the net8.0 tests.
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check generated constants match spec
        working-directory: .
        run: |
          pip install pyyaml
          python spec/tools/generate_dotnet.py --check

      - run: dotnet restore Tracescribe.sln
      - run: dotnet build Tracescribe.sln -c Release --no-restore
      - run: dotnet test Tracescribe.sln -c Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory ${{ runner.temp }}/test-results
      - name: Report failed tests
        if: failure()
        run: python tests/report_trx.py ${{ runner.temp }}/test-results

      - name: Run sample and export its trace
        run: dotnet run --project samples/ClaimIntake -c Release --no-build -- --export ${{ runner.temp }}/claim-trace.json

      - name: CLI against the exported trace
        run: |
          dotnet run --project src/Tracescribe.Mcp -f net8.0 -c Release --no-build -- failures --path ${{ runner.temp }}/claim-trace.json
          dotnet run --project src/Tracescribe.Mcp -f net8.0 -c Release --no-build -- services --path ${{ runner.temp }}/claim-trace.json

      - name: MCP server smoke test (stdio)
        run: python tests/mcp_smoke.py ${{ runner.temp }}/claim-trace.json -- dotnet src/Tracescribe.Mcp/bin/Release/net8.0/Tracescribe.Mcp.dll

      - name: Pack
        run: dotnet pack Tracescribe.sln -c Release --no-build -o ${{ runner.temp }}/packages

      - name: Install the MCP tool from the package
        run: |
          dotnet tool install Tracescribe.Mcp --prerelease --tool-path ${{ runner.temp }}/tool --add-source ${{ runner.temp }}/packages
          ${{ runner.temp }}/tool/tracescribe-mcp services --path ${{ runner.temp }}/claim-trace.json

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages
