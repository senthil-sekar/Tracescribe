name: dotnet

on:
  push:
    branches: [main]
    paths: ["dotnet/**", "spec/**", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["dotnet/**", "spec/**", ".github/workflows/dotnet.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Tracescribe.sln
      - run: dotnet build Tracescribe.sln -c Release --no-restore
      - run: dotnet test Tracescribe.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Run sample
        run: dotnet run --project samples/ClaimIntake -c Release --no-build
